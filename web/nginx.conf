server {
    listen 8443 ssl;
    server_name _;

    # Certificat generat local cu mkcert (vezi README)
    ssl_certificate     /etc/nginx/certs/essenza.pem;
    ssl_certificate_key /etc/nginx/certs/essenza-key.pem;

    client_max_body_size 8m;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Apelul intern de rezultat nu este expus prin web
    location /internal/ {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}
